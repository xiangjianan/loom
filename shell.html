<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Loom · 多模型工作台</title><!--STYLE--></head><body><aside class="sidebar" aria-label="工作台菜单"><div class="brand"><span class="logo">≋</span>loom</div><div class="sidebar-caption">多模型思考空间</div><nav class="sidebar-actions" aria-label="对话与模型"><button class="btn sidebar-new" id="new">＋ 新对话</button><button class="btn" id="history-open">◷ 历史对话</button><button class="btn" id="settings">模型配置</button></nav><div class="sidebar-section"><span class="sidebar-label">当前对话</span><h1 id="chat-title">多模型工作台</h1><span id="count" class="count">3 / 5 个模型</span><button class="btn" id="add">＋ 添加模型</button></div><div class="sidebar-bottom"><label class="switch"><input type="checkbox" id="highlight" checked>选中即高亮</label><p>选取值得继续的想法，<br>让下一轮思考更进一步。</p><div id="footer" class="bottom"></div></div></aside><div class="workspace"><div id="storage-warning" class="storage-warning" role="status" hidden></div><main id="board" class="board"></main><section class="compose"><div class="compose-meta"><span>✦ <span id="quote-count">高亮片段会加入下一轮提问</span></span><span>共享输入 · 独立回答</span></div><div id="quotes" class="quotes"></div><div class="inputbox"><textarea id="prompt" aria-label="向所有模型提问" placeholder="提出你的问题，或基于高亮内容继续探索…"></textarea><div class="inputfoot"><span class="hint">Enter 发送 <span style="margin-left:10px">Shift + Enter 换行</span></span><button class="btn primary" id="send">发送给所有模型 <span>↗</span></button></div></div></section></div><dialog id="dialog"><h2>连接你的模型</h2><div class="muted">每一列自由选择，让不同的模型加入思考。</div><div class="field"><label for="slot">选择对话列</label><select id="slot"></select></div><div class="field"><label for="provider">模型服务商</label><select id="provider"></select><div id="provider-note" class="muted"></div></div><div class="field"><label for="model">模型型号</label><input id="model" list="models" placeholder="选择或输入型号"><datalist id="models"></datalist><div class="model-note">可输入其他型号，以服务商账号支持的型号为准。</div></div><div class="field"><label for="key">API Key</label><input id="key" type="password" autocomplete="off" placeholder="粘贴该服务商的 API Key"></div><details class="advanced"><summary>高级设置 · API 接入地址</summary><div class="field"><label for="endpoint">API 地址</label><input id="endpoint" type="url"></div></details><div class="key-note">配置（含 API Key）与对话仅保存在本机浏览器，刷新后自动恢复。切换模型会开启该列的新对话。</div><div id="form-error" class="form-error" role="alert"></div><div class="dialogfoot"><button class="btn" id="remove">删除此列</button><button class="btn" id="close">取消</button><button class="btn primary" id="save">保存配置</button></div></dialog><dialog id="history-dialog"><div class="history-heading"><div><h2>历史对话</h2><div class="muted">自动保存在当前浏览器，随时继续思考。</div></div><button class="iconbtn" id="history-close" aria-label="关闭历史对话">×</button></div><input id="history-search" class="history-search" placeholder="搜索对话标题或内容…" aria-label="搜索历史对话"><div id="history-list"></div></dialog><!--LIBRARIES--><!--APP--></body></html>
