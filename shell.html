<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Loom · 多模型工作台</title><!--STYLE--></head><body><header><div class="brand"><span class="logo">≋</span>loom<span class="sub">多种视角，一个思考空间</span></div><div class="header-actions"><button class="btn" id="new">＋ 新对话</button><button class="btn" id="settings">模型配置</button></div></header><div class="toolbar"><div><div class="workspace-title"><h1>多模型工作台</h1><span id="count" class="count">3 / 5 个模型</span></div><div class="muted">并行探索 · 高亮灵感 · 持续迭代</div></div><div class="tools"><label class="switch"><input type="checkbox" id="highlight" checked>选中即高亮</label><button class="btn" id="add">＋ 添加模型</button></div></div><main id="board" class="board"></main><section class="compose"><div class="compose-meta"><span>✦ <span id="quote-count">高亮片段会加入下一轮提问</span></span><span>共享输入 · 独立回答</span></div><div id="quotes" class="quotes"></div><div class="inputbox"><textarea id="prompt" aria-label="向所有模型提问" placeholder="提出你的问题，或基于高亮内容继续探索…"></textarea><div class="inputfoot"><span class="hint">Enter 发送 <span style="margin-left:10px">Shift + Enter 换行</span></span><button class="btn primary" id="send">发送给所有模型 <span>↗</span></button></div></div><div id="footer" class="bottom"></div></section><dialog id="dialog"><h2>连接你的模型</h2><div class="muted">每一列自由选择，让不同的模型加入思考。</div><div class="field"><label for="slot">选择对话列</label><select id="slot"></select></div><div class="field"><label for="provider">模型服务商</label><select id="provider"></select><div id="provider-note" class="muted"></div></div><div class="field"><label for="model">模型型号</label><input id="model" list="models" placeholder="选择或输入型号"><datalist id="models"></datalist><div class="model-note">可输入其他型号，以服务商账号支持的型号为准。</div></div><div class="field"><label for="key">API Key</label><input id="key" type="password" autocomplete="off" placeholder="粘贴该服务商的 API Key"></div><details class="advanced"><summary>高级设置 · API 接入地址</summary><div class="field"><label for="endpoint">API 地址</label><input id="endpoint" type="url"></div></details><div class="key-note">密钥仅保留在当前会话内存中，刷新后需重新填写。切换模型会开启该列的新对话。</div><div id="form-error" class="form-error" role="alert"></div><div class="dialogfoot"><button class="btn" id="remove">删除此列</button><button class="btn" id="close">取消</button><button class="btn primary" id="save">保存配置</button></div></dialog><!--LIBRARIES--><!--APP--></body></html>
