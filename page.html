<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Loom · 多模型工作台</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f7f9;color:#26312e;font:14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:default}header{height:76px;background:white;border-bottom:1px solid #e6e9e8;display:flex;align-items:center;justify-content:space-between;padding:0 32px}.brand{font-size:27px;font-weight:700;letter-spacing:-1px;display:flex;align-items:center;gap:11px}.logo{background:#22594b;color:white;border-radius:12px;padding:4px 10px} .sub{color:#8a9490;font-size:13px;font-weight:400;letter-spacing:0;margin-left:16px}.btn{border:1px solid #dce2df;background:white;padding:9px 14px;border-radius:8px;color:#56625c}.primary{background:#285d4d;color:white;border:0}.toolbar{padding:23px 32px 18px;display:flex;justify-content:space-between;align-items:center}.toolbar h1{font-size:19px;margin:0 0 6px}.muted{color:#8a9490;font-size:12px}.tools{display:flex;align-items:center;gap:15px}.switch{display:flex;gap:8px;align-items:center;font-size:13px}.switch input{accent-color:#285d4d;width:30px;height:18px}.board{display:grid;gap:17px;padding:0 32px;height:calc(100vh - 340px);min-height:280px}.column{background:white;border:1px solid #e1e5e3;border-radius:12px;overflow:hidden;display:flex;flex-direction:column}.colhead{padding:19px 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #edf0ee}.model{display:flex;align-items:center;gap:10px;font-weight:600}.icon{border-radius:10px;padding:8px;background:#e9efff;color:#5874d6}.icon.i1{background:#f1ebfc;color:#8d6bc8}.icon.i2{background:#fff2e7;color:#c58a50}.status{font-size:11px;font-weight:400;color:#97a19c;margin-top:4px}.messages{overflow:auto;flex:1;padding:22px 20px;line-height:1.85;white-space:pre-wrap}.empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#99a39e;white-space:normal}.empty .glyph{font-size:30px;color:#bdc9c2;margin-bottom:18px}.empty strong{color:#63726a;font-weight:500;margin-bottom:8px}.empty p{max-width:230px;font-size:12px;line-height:1.8}.msg{margin-bottom:23px}.msg .label{font-size:10px;letter-spacing:1px;color:#9aa49e;margin-bottom:7px}.user{background:#f5f7f6;padding:12px;border-radius:8px;font-size:13px}.answer{font-size:14px}.error{color:#b35848}.highlight{background:#fff0ac;border-radius:3px}.compose{max-width:1080px;margin:18px auto 0;padding:0 20px}.quotes{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:8px;max-height:62px;overflow:auto}.chip{background:#fff7d8;border:1px solid #eadfae;border-radius:6px;padding:5px 8px;font-size:11px;max-width:280px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chip button{border:0;background:none;margin-left:8px}.inputbox{background:white;border:1px solid #dce3df;box-shadow:0 3px 16px #233c2910;border-radius:13px;padding:15px 17px}.inputbox textarea{width:100%;height:52px;resize:none;border:0;outline:0;line-height:1.7;background:none}.inputfoot{display:flex;justify-content:space-between;align-items:center}.hint{font-size:11px;color:#99a29d}.bottom{text-align:center;color:#a0a8a3;font-size:11px;padding:12px}.badge{font-size:10px;border:1px solid #d6e5dc;border-radius:5px;padding:3px 6px;color:#537761;margin-right:8px}dialog{border:1px solid #dde4df;border-radius:16px;padding:27px;width:540px;max-width:95vw;box-shadow:0 20px 90px #23392b33}dialog::backdrop{background:#1b302a55}dialog h2{margin:0 0 8px;font-size:20px}.field{margin-top:17px}.field label{display:block;font-size:12px;color:#6c7972;margin-bottom:7px}.field input,.field select{width:100%;padding:11px;border:1px solid #dbe3dd;border-radius:7px;background:white}.dialogfoot{margin-top:24px;display:flex;justify-content:flex-end;gap:8px}.intro{display:flex;gap:7px;margin-top:12px}.intro button{font-size:11px;background:#f6f8f6;border:1px solid #e5eae6;border-radius:6px;padding:6px 10px;color:#6e7e73}@media(max-width:850px){.sub{display:none}.board{padding:0 15px;gap:10px;overflow:auto;grid-template-columns:repeat(3,280px)!important}header,.toolbar{padding-left:18px;padding-right:18px}.tools{gap:6px}.hint{display:none}}
</style></head><body><header><div class="brand"><span class="logo">≋</span>loom<span class="sub">让不同的思考，织成更好的答案</span></div><div><button class="btn" id="new">＋ 新对话</button> <button class="btn" id="settings">⚙ 模型配置</button></div></header><div class="toolbar"><div><h1>多模型工作台 <span class="badge">PARALLEL THINKING</span></h1><div class="muted">一个问题，多种视角。选出值得继续的想法。</div></div><div class="tools"><label class="switch"><input type="checkbox" id="highlight" checked>选中即高亮</label><button class="btn" id="add">＋ 添加模型</button></div></div><main class="board" id="board"></main><section class="compose"><div class="quotes" id="quotes"></div><div class="inputbox"><textarea id="prompt" placeholder="向所有模型提问，或基于高亮内容继续探索…"></textarea><div class="inputfoot"><span class="hint">✦ 高亮内容会自动加入下一轮提问 <span style="margin-left:15px">Enter 发送 · Shift + Enter 换行</span></span><button class="btn primary" id="send">发送给所有模型 ↗</button></div></div><div class="bottom" id="footer">3 个模型 · 独立思考，共同推进</div></section><dialog id="dialog"><h2>配置模型</h2><div class="muted">每列独立配置。API Key 仅保留在当前浏览器会话内存中。</div><div class="field"><label>对话列</label><select id="slot"></select></div><div class="field"><label>模型服务商</label><select id="provider"></select></div><div class="field"><label>模型型号（可手动修改）</label><input id="model" list="models"><datalist id="models"></datalist></div><div class="field"><label>API 地址 · OpenAI 兼容接口</label><input id="endpoint"></div><div class="field"><label>API Key</label><input id="key" type="password" autocomplete="off" placeholder="输入 API Key"></div><div class="muted" style="margin-top:12px">密钥只用于转发到所选服务商，不写入本地存储。模型可用性以服务商账号为准。</div><div class="dialogfoot"><button class="btn" id="remove">移除此列</button><button class="btn" id="close">取消</button><button class="btn primary" id="save">保存配置</button></div></dialog><script>
const providers={DeepSeek:['https://api.deepseek.com/v1',['deepseek-chat','deepseek-reasoner']],GLM:['https://open.bigmodel.cn/api/paas/v4',['glm-4.5','glm-4.5-air','glm-4-plus']],千问:['https://dashscope.aliyuncs.com/compatible-mode/v1',['qwen-plus','qwen-max','qwen-turbo']],OpenAI:['https://api.openai.com/v1',['gpt-4.1','gpt-4.1-mini','o3','o4-mini']],Kimi:['https://api.moonshot.cn/v1',['kimi-k2-0905-preview','moonshot-v1-128k']],豆包:['https://ark.cn-beijing.volces.com/api/v3',['输入火山引擎接入点 ID']],硅基流动:['https://api.siliconflow.cn/v1',['deepseek-ai/DeepSeek-V3','Qwen/Qwen3-235B-A22B']],Gemini:['https://generativelanguage.googleapis.com/v1beta/openai',['gemini-2.5-pro','gemini-2.5-flash']],Mistral:['https://api.mistral.ai/v1',['mistral-large-latest','mistral-small-latest']],OpenRouter:['https://openrouter.ai/api/v1',['anthropic/claude-sonnet-4','google/gemini-2.5-pro']],自定义:['',['']]};
let cols=['DeepSeek','GLM','千问'].map(p=>({provider:p,model:providers[p][1][0],endpoint:providers[p][0],key:'',history:[],highlights:[],busy:false})),quotes=[],round=0;
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){ $('board').style.gridTemplateColumns=`repeat(${cols.length},minmax(0,1fr))`;$('board').innerHTML=cols.map((c,i)=>`<article class="column"><div class="colhead"><div class="model"><span class="icon i${i%3}">${['◈','✳','✦'][i%3]}</span><div>${esc(c.provider)}<div class="status">${esc(c.model)} · ${c.busy?'正在思考…':c.key?'已配置':'待配置'}</div></div></div><button class="btn config" data-i="${i}" aria-label="配置 ${esc(c.provider)}">⌄</button></div><div class="messages" data-col="${i}">${c.history.length?c.history.map((m,j)=>`<div class="msg"><div class="label">${m.role==='user'?'YOU · 提问':esc(c.provider)+' · 回答'}</div><div class="${m.role==='user'?'user':'answer'} ${m.error?'error':''}" data-message="${j}">${m.role==='assistant'?(c.highlights||[]).reduce((html,t)=>html.split(esc(t)).join('<mark class="highlight">'+esc(t)+'</mark>'),esc(m.content)):esc(m.content)}</div></div>`).join('')+(c.busy?'<div class="muted">● ● ● 正在生成回答</div>':''):`<div class="empty"><div class="glyph">${['◈','✳','✦'][i%3]}</div><strong>不同视角，从同一个问题开始</strong><p>配置 ${esc(c.provider)} 的 API Key，<br>在下方输入你的第一个问题。</p><button class="btn config" data-i="${i}">连接模型 ↗</button></div>`}</div></article>`).join('');document.querySelectorAll('.config').forEach(b=>b.onclick=()=>openConfig(+b.dataset.i));document.querySelectorAll('.messages').forEach(el=>el.scrollTop=el.scrollHeight);$('footer').textContent=`${cols.length} 个模型 · ${round?`已进行 ${round} 轮对话`:'独立思考，共同推进'}`;}
function renderQuotes(){$('quotes').innerHTML=quotes.map((q,i)=>`<span class="chip" title="${esc(q.text)}">${esc(q.source)} · ${esc(q.text)}<button data-q="${i}" aria-label="移除引用">×</button></span>`).join('');document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{quotes.splice(+b.dataset.q,1);renderQuotes()});}
$('board').addEventListener('mouseup',()=>{if(!$('highlight').checked)return;const s=window.getSelection();if(!s.rangeCount||s.isCollapsed)return;const r=s.getRangeAt(0),el=s.anchorNode.parentElement.closest('.answer');if(!el||!el.contains(s.focusNode))return;const text=s.toString().trim();if(!text)return;const col=+el.closest('[data-col]').dataset.col;if(quotes.some(q=>q.text===text&&q.source===cols[col].provider))return;try{let mark=document.createElement('mark');mark.className='highlight';mark.append(r.extractContents());r.insertNode(mark);cols[col].highlights.push(text);quotes.push({text,source:cols[col].provider});renderQuotes();s.removeAllRanges()}catch{}});
$('provider').innerHTML=Object.keys(providers).map(p=>`<option>${p}</option>`).join('');function fillProvider(){const p=providers[$('provider').value];$('endpoint').value=p[0];$('model').value=p[1][0];$('models').innerHTML=p[1].map(m=>`<option value="${esc(m)}">`).join('')}$('provider').onchange=fillProvider;
function loadSlot(){const c=cols[+$('slot').value];$('provider').value=c.provider;fillProvider();$('model').value=c.model;$('endpoint').value=c.endpoint;$('key').value=c.key;$('remove').disabled=cols.length<=1;}
function openConfig(i=0){if(cols.some(c=>c.busy))return;$('slot').innerHTML=cols.map((c,j)=>`<option value="${j}">第 ${j+1} 列 · ${esc(c.provider)}</option>`).join('');$('slot').value=i;loadSlot();$('dialog').showModal()}$('slot').onchange=loadSlot;$('settings').onclick=()=>openConfig();$('close').onclick=()=>$('dialog').close();$('save').onclick=()=>{const c=cols[+$('slot').value];Object.assign(c,{provider:$('provider').value,model:$('model').value.trim(),endpoint:$('endpoint').value.trim().replace(/\/$/,''),key:$('key').value.trim()});$('dialog').close();render()};$('remove').onclick=()=>{cols.splice(+$('slot').value,1);$('dialog').close();render()};$('add').onclick=()=>{if(cols.some(c=>c.busy))return;cols.push({provider:'OpenAI',model:'gpt-4.1',endpoint:providers.OpenAI[0],key:'',history:[],highlights:[],busy:false});render();openConfig(cols.length-1)};
$('new').onclick=()=>{if(cols.some(c=>c.busy))return;cols.forEach(c=>{c.history=[];c.highlights=[]});quotes=[];round=0;renderQuotes();render()};
async function send(){const prompt=$('prompt').value.trim();if(!prompt||cols.some(c=>c.busy))return;if(cols.some(c=>!c.key||!c.model||!c.endpoint)){openConfig(cols.findIndex(c=>!c.key||!c.model||!c.endpoint));return}const refs=quotes.length?'\n\n以下是我选中的参考内容，请结合这些内容继续思考：\n'+quotes.map(q=>`【${q.source}】\n${q.text}`).join('\n\n'):'';const content=prompt+refs;$('prompt').value='';quotes=[];renderQuotes();round++;cols.forEach(c=>{c.history=c.history.filter(m=>!m.error);c.history.push({role:'user',content});c.busy=true});$('send').disabled=true;$('settings').disabled=true;render();await Promise.allSettled(cols.map(async c=>{try{const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({endpoint:c.endpoint,key:c.key,model:c.model,messages:c.history.map(({role,content})=>({role,content}))})});const data=await res.json();if(!res.ok)throw Error(data.error||'请求失败');const answer=data.choices?.[0]?.message?.content;if(typeof answer!=='string')throw Error('模型未返回文本，请检查型号和接口');c.history.push({role:'assistant',content:answer})}catch(e){c.history.push({role:'assistant',content:'连接失败：'+e.message+'。请检查配置后重新发送。',error:true})}finally{c.busy=false;render()}}));$('send').disabled=false;$('settings').disabled=false;}
$('send').onclick=send;$('prompt').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();send()}});render();
</script></body></html>
